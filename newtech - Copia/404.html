<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('newtech_tema');
        var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = salvo || sistema;
      } catch (e) { document.documentElement.dataset.tema = 'escuro'; }
    })();
  </script>

  <title>Página não encontrada — NewTech</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NewTech">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230071e3'/%3E%3Ctext x='50' y='70' font-family='-apple-system,sans-serif' font-size='58' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/print.css">
  <link rel="stylesheet" href="css/produto-img.css">

  <style>
    .erro-404 {
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 22px;
    }
    .erro-404 .codigo {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      background: linear-gradient(180deg,
        var(--titulo-grad-1) 30%,
        var(--titulo-grad-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
      animation: flutuar404 5s ease-in-out infinite;
    }
    @keyframes flutuar404 {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    .erro-404 h1 {
      font-size: clamp(1.3rem, 3.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 12px;
    }
    .erro-404 p {
      color: var(--muted);
      font-size: 15px;
      max-width: 420px;
      margin-bottom: 30px;
      line-height: 1.55;
    }
    .erro-404 .acoes {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .erro-404 .btn-cheio,
    .erro-404 .btn-contorno {
      padding: 11px 26px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: transform .3s var(--ease),
                  background .3s var(--ease),
                  box-shadow .3s var(--ease);
    }
    .erro-404 .btn-cheio {
      background: #0071e3;
      color: #fff;
    }
    .erro-404 .btn-cheio:hover {
      background: #0077ed;
      transform: scale(1.04);
      box-shadow: 0 0 0 6px rgba(0,113,227,.16);
    }
    .erro-404 .btn-contorno {
      border: 1px solid #0071e3;
      color: #4aa3ff;
      background: transparent;
    }
    .erro-404 .btn-contorno:hover {
      background: rgba(0,113,227,.12);
      transform: scale(1.04);
    }
    .erro-404 .path {
      margin-top: 26px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 980px;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">NewTech</a>
      <nav class="links">
        <a href="index.html#produtos">Produtos</a>
        <a href="index.html#vantagens">Vantagens</a>
        <a href="index.html#contato">Contato</a>
      </nav>
      <div class="nav-acoes">
        <button class="tema-btn" id="btnTema" aria-label="Alternar tema">
          <span class="tema-icone" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="erro-404">
    <div class="codigo">404</div>
    <h1>Essa página não existe</h1>
    <p>Talvez o link esteja quebrado ou o produto que você procura tenha saído de linha. Mas temos iPhones incríveis esperando por você.</p>
    <div class="acoes">
      <a href="index.html" class="btn-cheio">Ir para a loja</a>
      <a href="index.html#produtos" class="btn-contorno">Ver iPhones</a>
    </div>
    <span class="path" id="pathErro"></span>
  </main>

  <script>
    // Mostra o caminho tentado (útil pra debug)
    var path = document.getElementById('pathErro');
    if (path && location.pathname && location.pathname !== '/') {
      path.textContent = location.pathname;
    } else {
      path.style.display = 'none';
    }
  </script>

  <script src="js/ui.js"></script>
  <script src="js/tema-auto.js"></script>
</body>
</html>
