<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('newtech_tema');
        var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = salvo || sistema;
      } catch (e) { document.documentElement.dataset.tema = 'escuro'; }
    })();
  </script>

  <title>Sem conexão — NewTech</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230071e3'/%3E%3Ctext x='50' y='70' font-family='-apple-system,sans-serif' font-size='58' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/base/base.css">
  <link rel="stylesheet" href="css/base/tema.css">
  <link rel="stylesheet" href="css/utilidades/print.css">
  <link rel="stylesheet" href="css/utilidades/produto-img.css">

  <style>
    .offline {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 22px;
    }
    .offline-icone {
      font-size: 72px;
      margin-bottom: 22px;
      filter: grayscale(.4);
      animation: flutuarOff 3s ease-in-out infinite;
    }
    @keyframes flutuarOff {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .offline h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -.025em;
      margin-bottom: 10px;
      background: linear-gradient(180deg, var(--titulo-grad-1) 30%, var(--titulo-grad-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .offline p {
      color: var(--muted);
      font-size: 16px;
      max-width: 420px;
      margin-bottom: 30px;
      line-height: 1.55;
    }
    .offline .dica {
      font-size: 13px;
      color: var(--muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="offline">
    <div class="offline-icone">📡</div>
    <h1>Sem conexão</h1>
    <p>Você está offline no momento. Algumas partes da loja continuam funcionando com o cache local.</p>
    <a href="index.html" class="btn-primario">Tentar novamente</a>
    <p class="dica">Suas sacolas e favoritos estão salvos no aparelho.</p>
  </div>

  <script src="js/core/tema-auto.js"></script>

</body>
</html>
